spring.application.name=raisetimeline
server.port=8080

# 開発時はリポジトリ直下の .env を読む(OS の環境変数が優先される)
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:raisetimeline}
spring.datasource.username=${DB_USER:raisetimeline}
spring.datasource.password=${DB_PASSWORD}

# SQL は Mapper インターフェースではなく XML に書く
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# JWT(秘密鍵は環境変数 JWT_SECRET で渡す。32 バイト以上)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=15m

# リフレッシュトークン(HttpOnly Cookie)。本番は HTTPS のため Secure を付ける
app.refresh.expiration=7d
app.refresh.cookie-secure=${REFRESH_COOKIE_SECURE:true}
app.refresh.reuse-grace=10s

# 公開するのは /api/health のみ
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health

# 画像用 S3。開発は S3 互換サーバー(docker-compose の s3、S3_ENDPOINT)、AWS では endpoint を空にして IAM ロールで認証する
app.s3.bucket=${S3_BUCKET:raisetimeline-images}
app.s3.region=${AWS_REGION:ap-northeast-1}
app.s3.endpoint=${S3_ENDPOINT:}
app.s3.access-key=${S3_ACCESS_KEY:}
app.s3.secret-key=${S3_SECRET_KEY:}
app.s3.put-expiry=5m
app.s3.get-expiry=15m

# API 仕様書(OpenAPI)と Swagger UI。既定は無効(本番は設定しない)。開発では .env に API_DOCS_ENABLED=true を書く。
# 有効にすると /v3/api-docs と /swagger-ui.html が認証なしで見られる(仕様に秘密情報は含まれない)
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
# 出力の並びを固定する(docs/api/openapi.yaml との比較で、並び順の違いを差分にしない)
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
# 応答・リクエストは JSON(仕様で `*/*` と表示されないようにする)
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# ログ。LOG_FORMAT=ecs(または logstash)でコンソールのログを JSON にする。未指定は読みやすいテキスト(開発用)。
# 本番・監視サービスへ送る環境は ecs にする。詳細は docs/07-observability.md
logging.structured.format.console=${LOG_FORMAT:}
logging.structured.ecs.service.name=raisetimeline
logging.structured.ecs.service.version=${APP_VERSION:unknown}
logging.structured.ecs.service.environment=${APP_ENV:dev}
