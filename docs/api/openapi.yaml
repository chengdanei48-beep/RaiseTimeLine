components:
  schemas:
    AuthResponse:
      type: object
      description: ログイン・登録・トークン更新の結果。リフレッシュトークンは Cookie(HttpOnly)で別に返る
      properties:
        accessToken:
          type: string
          description: "アクセストークン(JWT)。`Authorization: Bearer` で送る"
        expiresIn:
          type: integer
          format: int64
          description: アクセストークンの有効期間(秒)
          example: 900
        tokenType:
          type: string
          description: トークンの種類(常に Bearer)
          example: Bearer
        user:
          $ref: "#/components/schemas/UserResponse"
          description: ログインしたユーザー
    AuthorResponse:
      type: object
      description: 投稿・コメントした人
      properties:
        avatarUrl:
          type: string
          description: アイコンの表示用の署名付き URL(期限つき)。未設定なら null
        displayName:
          type: string
          description: 表示名
          example: 佐藤花子
        id:
          type: integer
          format: int64
          description: ユーザーの内部 ID
          example: 7
        username:
          type: string
          description: ユーザーID(@ハンドル)
          example: hanako
    CommentListResponse:
      type: object
      description: コメントの一覧(ページング)
      properties:
        items:
          type: array
          description: コメント(古い順)
          items:
            $ref: "#/components/schemas/CommentResponse"
        nextCursor:
          type: string
          description: 次ページを取る `cursor`。次ページが無いとき null
    CommentResponse:
      type: object
      description: コメント
      properties:
        author:
          $ref: "#/components/schemas/AuthorResponse"
          description: コメントした人
        body:
          type: string
          description: 本文(1〜280文字)
          example: 素敵ですね!
        createdAt:
          type: string
          format: date-time
          description: 作成日時(UTC)
        id:
          type: integer
          format: int64
          description: コメントの ID
          example: 116
    CreateCommentRequest:
      type: object
      description: コメントの入力
      properties:
        body:
          type: string
          description: 本文。前後の空白を除いて 1〜280文字
          example: 素敵ですね!
          maxLength: 280
          minLength: 1
      required:
      - body
    CreatePostRequest:
      type: object
      description: 投稿の入力
      properties:
        body:
          type: string
          description: 本文。前後の空白を除いて 1〜280文字(画像のみの投稿は不可)
          example: 今日はいい天気ですね
          maxLength: 280
          minLength: 1
        imageKeys:
          type: array
          description: アップロード済みの画像のキー(0〜4件。先頭が 1 枚目)。`POST /api/uploads/presign` が返した
            `objectKey` で、自分のもの・S3 に存在・5MB 以下・画像形式であること。重複は不可
          example:
          - posts/7/3f2a0c1e-9d2b-4a61-8c53-0a7e3b1f5d24.jpg
          items:
            type: string
            minLength: 1
          maxItems: 4
          minItems: 0
      required:
      - body
    FollowUserListResponse:
      type: object
      description: ユーザーの一覧(ページング)。フォロー中・フォロワー・検索で共通
      properties:
        items:
          type: array
          description: ユーザー
          items:
            $ref: "#/components/schemas/FollowUserResponse"
        nextCursor:
          type: string
          description: 次ページを取る `cursor`。次ページが無いとき null
    FollowUserResponse:
      type: object
      description: 一覧に出るユーザー(フォロー中・フォロワー・検索結果)
      properties:
        avatarUrl:
          type: string
          description: アイコンの表示用の署名付き URL(期限つき)。未設定なら null
        bio:
          type: string
          description: 自己紹介。未設定なら null
          example: よろしくお願いします
        displayName:
          type: string
          description: 表示名
          example: 佐藤花子
        followedByMe:
          type: boolean
          description: 自分がフォロー済みか。自分自身の行では null(フォローボタンを出さない)
        id:
          type: integer
          format: int64
          description: ユーザーの内部 ID
          example: 7
        username:
          type: string
          description: ユーザーID(@ハンドル)
          example: hanako
    ImageResponse:
      type: object
      description: 投稿の画像
      properties:
        sortOrder:
          type: integer
          format: int32
          description: 表示順(0〜3)
          example: 0
        url:
          type: string
          description: 表示用の署名付き URL(有効期限 15 分)
    LoginRequest:
      type: object
      description: ログインの入力
      properties:
        password:
          type: string
          format: password
          description: パスワード
          example: password123
          minLength: 1
        username:
          type: string
          description: ユーザーID(大文字小文字を区別しない)
          example: hanako
          minLength: 1
      required:
      - password
      - username
    PostResponse:
      type: object
      description: 投稿(画像・いいね数・コメント数・自分のいいね済みを含む)。閲覧数・インプレッションの項目は無い
      properties:
        author:
          $ref: "#/components/schemas/AuthorResponse"
          description: 投稿した人
        body:
          type: string
          description: 本文(1〜280文字)
          example: 今日はいい天気ですね
        commentCount:
          type: integer
          format: int64
          description: コメント数(削除済みを除く)
          example: 3
        createdAt:
          type: string
          format: date-time
          description: 作成日時(UTC)
        id:
          type: integer
          format: int64
          description: 投稿の ID
          example: 101
        images:
          type: array
          description: 画像(表示順。最大4枚。無ければ空)
          items:
            $ref: "#/components/schemas/ImageResponse"
        likeCount:
          type: integer
          format: int64
          description: いいね数
          example: 12
        likedByMe:
          type: boolean
          description: 自分がいいね済みか
        updatedAt:
          type: string
          format: date-time
          description: 最終更新日時(UTC)。`createdAt` より後なら「編集済み」
    PresignRequest:
      type: object
      description: 署名付き URL の依頼
      properties:
        contentType:
          type: string
          description: 画像の形式。`image/jpeg`・`image/png`・`image/gif`・`image/webp` のいずれか
          example: image/jpeg
          minLength: 1
        purpose:
          type: string
          description: 用途。`POST`=投稿画像(5MB 以下)、`AVATAR`=アイコン(2MB 以下)
          enum:
          - POST
          - AVATAR
        size:
          type: integer
          format: int64
          description: 画像のバイト数
          example: 204800
          exclusiveMinimum: 0
      required:
      - contentType
      - purpose
      - size
    Problem:
      description: エラー応答(RFC 9457 ProblemDetail)
      properties:
        detail:
          type: string
          description: 利用者に見せてよいメッセージ
          example: 入力内容に誤りがあります
        errors:
          type: object
          additionalProperties:
            type: string
            description: 項目ごとのエラー(入力検証の失敗時だけ)。キーは項目名、値はメッセージ
          description: 項目ごとのエラー(入力検証の失敗時だけ)。キーは項目名、値はメッセージ
        instance:
          type: string
          description: リクエストのパス
          example: /api/posts
        status:
          type: integer
          format: int32
          description: HTTP ステータス
          example: 400
        title:
          type: string
          description: ステータスの名前
          example: Bad Request
        type:
          type: string
          description: 問題の種類(URI)。通常は省略される
          example: about:blank
    ProfileResponse:
      type: object
      description: プロフィール。閲覧数・インプレッションの項目は無い
      properties:
        avatarUrl:
          type: string
          description: アイコンの表示用の署名付き URL(期限つき)。未設定なら null
        bio:
          type: string
          description: 自己紹介(0〜160文字)。未設定なら null
          example: よろしくお願いします
        displayName:
          type: string
          description: 表示名
          example: 佐藤花子
        followedByMe:
          type: boolean
          description: 自分がフォロー済みか(自分自身のときは常に false)
        followerCount:
          type: integer
          format: int64
          description: フォロワーの人数
          example: 32
        followingCount:
          type: integer
          format: int64
          description: フォロー中の人数
          example: 15
        id:
          type: integer
          format: int64
          description: ユーザーの内部 ID
          example: 7
        isMe:
          type: boolean
          description: 自分自身か
        postCount:
          type: integer
          format: int64
          description: 投稿数(削除済みを除く)
          example: 24
        username:
          type: string
          description: ユーザーID(@ハンドル)。変更できない
          example: hanako
    RegisterRequest:
      type: object
      description: 新規登録の入力
      properties:
        displayName:
          type: string
          description: 表示名(1〜30文字。前後の空白は除く)
          example: 佐藤花子
          maxLength: 30
          minLength: 1
        password:
          type: string
          format: password
          description: パスワード(8〜72文字、72バイト以内)
          example: password123
          maxLength: 72
          minLength: 8
        username:
          type: string
          description: ユーザーID。3〜15文字の半角英数字と `_`。大文字小文字を区別せず重複不可
          example: hanako
          pattern: "[A-Za-z0-9_]{3,15}"
      required:
      - displayName
      - password
      - username
    TimelineResponse:
      type: object
      description: 投稿の一覧(ページング)。タイムライン・ユーザー別の投稿で共通
      properties:
        items:
          type: array
          description: 投稿(新しい順)
          items:
            $ref: "#/components/schemas/PostResponse"
        nextCursor:
          type: string
          description: 次ページを取る `cursor`。次ページが無いとき null
    UpdatePostRequest:
      type: object
      description: 投稿の編集の入力(本文だけ。画像は変更できない)
      properties:
        body:
          type: string
          description: 本文。前後の空白を除いて 1〜280文字
          example: 直しました
          maxLength: 280
          minLength: 1
      required:
      - body
    UpdateProfileRequest:
      type: object
      properties:
        avatarKey:
          type:
          - string
          - "null"
          description: アイコンのキー。**省略=変更なし / `null`=削除 / 文字列=新しいアイコン**。文字列は `POST /api/uploads/presign`(`purpose=AVATAR`)が返した自分の
            `objectKey` で、S3 に存在し 2MB 以下の画像であること
          example: avatars/7/3f2a0c1e-9d2b-4a61-8c53-0a7e3b1f5d24.png
        bio:
          type: string
          description: 自己紹介。0〜160文字(省略・空にすると消える)
          example: よろしくお願いします
          maxLength: 160
          minLength: 0
        displayName:
          type: string
          description: 表示名。前後の空白を除いて 1〜30文字
          example: 佐藤花子
          maxLength: 30
          minLength: 1
      required:
      - displayName
    UserResponse:
      type: object
      description: ユーザーの基本情報
      properties:
        avatarUrl:
          type: string
          description: アイコンの表示用の署名付き URL(期限つき)。未設定なら null
        displayName:
          type: string
          description: 表示名
          example: 佐藤花子
        id:
          type: integer
          format: int64
          description: ユーザーの内部 ID
          example: 7
        username:
          type: string
          description: ユーザーID(@ハンドル)。3〜15文字の半角英数字と `_`
          example: hanako
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: ログインで得たアクセストークン
      scheme: bearer
      type: http
