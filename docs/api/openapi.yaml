      - description: 前回の応答の `nextCursor`。省略すると先頭から(中身は不透明な文字列で、解釈しない)
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: 1ページの件数。1〜50、省略時は 20
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
