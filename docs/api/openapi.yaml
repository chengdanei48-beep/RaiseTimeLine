              schema:
                $ref: "#/components/schemas/Problem"
          description: 入力内容の誤り
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 未ログイン、またはトークンが無効・期限切れ
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 対象が存在しない(削除済みを含む)
      summary: ユーザーの投稿一覧
