        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 対象が存在しない(削除済みを含む)
      summary: フォローする
      tags:
      - ユーザー・フォロー
  /api/users/{id}/followers:
