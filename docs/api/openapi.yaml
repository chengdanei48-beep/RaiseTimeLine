openapi: 3.1.0
info:
  description: |-
    テキスト中心の SNS「RaiseTimeLine」の API。インプレッション数・リポストに当たる機能はない。

    - 認証: `POST /api/auth/login` で得たアクセストークンを `Authorization: Bearer <token>` で送る。リフレッシュトークンは HttpOnly の Cookie(Path は `/api/auth`)で受け渡す
    - エラー: すべて `Problem`(RFC 9457 ProblemDetail)形式
    - 一覧のページング: `cursor`(前回応答の `nextCursor`)と `limit`(1〜50、既定 20)
    - 画像: `POST /api/uploads/presign` で署名付き URL を得て S3 へ直接 PUT し、返ったキーを保存時に渡す
  title: RaiseTimeLine API
  version: v1
servers:
- description: 開発(ローカル)
  url: http://localhost:8080
security:
- bearerAuth: []
tags:
- description: 投稿の作成・取得・編集・削除、タイムライン(F-POST / F-TL)
  name: 投稿・タイムライン
- description: プロフィール、ユーザー別の投稿、フォロー・フォロワー(F-PROF / F-FOLLOW)
  name: ユーザー・フォロー
- description: いいね・取り消し(F-LIKE)
  name: いいね
- description: S3 へ直接アップロードするための署名付き URL(F-POST / F-PROF)
  name: 画像アップロード
- description: 新規登録・ログイン・トークン更新・ログアウト(F-AUTH)
  name: 認証
- description: ユーザーIDと表示名の検索(F-SEARCH)
  name: ユーザー検索
- description: 自分のプロフィールの取得・更新(F-PROF)
  name: プロフィール(自分)
- description: 投稿へのコメント(F-CMT)
  name: コメント
paths:
  /api/auth/login:
    post:
      description: ユーザーIDとパスワードで認証する。リフレッシュトークンは Cookie(HttpOnly)で返す。ユーザーIDの有無が分からないよう、失敗はどちらの誤りでも同じ応答にする。
      operationId: auth_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: ログインした
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 入力内容の誤り
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: ユーザーIDまたはパスワードが正しくない
      security: []
      summary: ログイン
      tags:
      - 認証
  /api/auth/logout:
    post:
      description: リフレッシュトークンを失効させ、Cookie を削除する。アクセストークンが期限切れでも呼べる(冪等)。
      operationId: auth_logout
      parameters:
      - in: cookie
        name: refresh_token
        required: false
        schema:
          type: string
      responses:
        "204":
          description: ログアウトした
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 入力内容の誤り
      security: []
      summary: ログアウト
      tags:
      - 認証
  /api/auth/me:
    get:
      description: 画面の初期表示・ヘッダー用に、自分の基本情報を返す。
      operationId: auth_me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 未ログイン、またはトークンが無効・期限切れ
      summary: ログイン中のユーザーを取得
      tags:
      - 認証
  /api/auth/refresh:
    post:
      description: リフレッシュトークン(Cookie)で、新しいアクセストークンとリフレッシュトークンを発行する(使い捨て。ローテーションし、再利用は検知して失効させる)。リロード後のログイン復元にも使う。
      operationId: auth_refresh
      parameters:
      - in: cookie
        name: refresh_token
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: 更新した
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 入力内容の誤り
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: リフレッシュトークンが無い・無効・失効・期限切れ(Cookie は削除される)
      security: []
      summary: トークンの更新
      tags:
      - 認証
  /api/auth/register:
    post:
      description: アカウントを作り、そのままログイン状態にする。リフレッシュトークンは Cookie(HttpOnly)で返す。ユーザーIDは大文字小文字を区別せず重複不可。
      operationId: auth_register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: 登録した(ログイン状態)
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 入力内容の誤り
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: ユーザーIDがすでに使われている
      security: []
      summary: 新規登録
      tags:
      - 認証
  /api/comments/{id}:
    delete:
      description: 論理削除。作成者のみ。
      operationId: comment_delete
      parameters:
      - description: 対象の ID(内部ID・数値)
        in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 入力内容の誤り
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 未ログイン、またはトークンが無効・期限切れ
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 他人のコメント
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 対象が存在しない(削除済みを含む)
      summary: コメントを削除
      tags:
      - コメント
  /api/posts:
    post:
      description: 本文(1〜280文字)と、アップロード済みの画像(最大4枚)で投稿する。画像のみの投稿は不可。画像は先に `POST /api/uploads/presign`
        で署名付き URL を得て S3 へ PUT し、返った `objectKey` を `imageKeys` に渡す(自分のキー・S3 に存在・5MB
        以下・画像形式であること)。
      operationId: post_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"
          description: "作成した(`Location` に `/api/posts/{id}`)"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 入力内容の誤り
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 未ログイン、またはトークンが無効・期限切れ
      summary: 投稿を作成
      tags:
      - 投稿・タイムライン
  /api/posts/{id}:
    delete:
      description: 論理削除。コメント・いいね・画像も表示されなくなる。本人のみ。
      operationId: post_delete
      parameters:
      - description: 対象の ID(内部ID・数値)
        in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 入力内容の誤り
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 未ログイン、またはトークンが無効・期限切れ
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 他人の投稿
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 対象が存在しない(削除済みを含む)
      summary: 投稿を削除
      tags:
      - 投稿・タイムライン
    get:
      description: 投稿1件(画像・いいね数・コメント数・自分のいいね済みを含む)。削除済みは 404。
      operationId: post_get
      parameters:
      - description: 対象の ID(内部ID・数値)
        in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 入力内容の誤り
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 未ログイン、またはトークンが無効・期限切れ
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 対象が存在しない(削除済みを含む)
      summary: 投稿を取得
      tags:
      - 投稿・タイムライン
    patch:
      description: 本文だけを変更できる(画像は変更不可)。本人のみ。
      operationId: post_update
      parameters:
      - description: 対象の ID(内部ID・数値)
        in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 入力内容の誤り
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 未ログイン、またはトークンが無効・期限切れ
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 他人の投稿
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 対象が存在しない(削除済みを含む)
      summary: 投稿を編集
      tags:
      - 投稿・タイムライン
  /api/posts/{postId}/comments:
    get:
      description: 古い順(作成日時の昇順、同時刻は ID の昇順)。削除済みは含まない。
      operationId: comment_list
      parameters:
      - description: 投稿の ID
        in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      - description: 前回の応答の `nextCursor`。省略すると先頭から(中身は不透明な文字列で、解釈しない)
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: 1ページの件数。1〜50、省略時は 20
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 50
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentListResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 入力内容の誤り
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 未ログイン、またはトークンが無効・期限切れ
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 対象が存在しない(削除済みを含む)
      summary: コメント一覧
      tags:
      - コメント
    post:
      description: 本文(1〜280文字)。自分の投稿にも、他人の投稿にもできる。コメントへのコメントは不可。
      operationId: comment_create
      parameters:
      - description: 投稿の ID
        in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
          description: 投稿した
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 入力内容の誤り
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 未ログイン、またはトークンが無効・期限切れ
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 対象が存在しない(削除済みを含む)
      summary: コメントを投稿
      tags:
      - コメント
  /api/posts/{postId}/like:
    delete:
      description: 冪等(いいねしていなくても 204)。
      operationId: like_unlike
      parameters:
      - description: 投稿の ID
        in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 入力内容の誤り
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 未ログイン、またはトークンが無効・期限切れ
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 対象が存在しない(削除済みを含む)
      summary: いいねを取り消す
      tags:
      - いいね
    put:
      description: 冪等(すでにいいね済みでも 204)。自分の投稿にもできる。
      operationId: like_like
      parameters:
      - description: 投稿の ID
        in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 入力内容の誤り
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 未ログイン、またはトークンが無効・期限切れ
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 対象が存在しない(削除済みを含む)
      summary: いいね
      tags:
      - いいね
  /api/timeline:
    get:
      description: 新しい順(作成日時、同時刻は ID の降順)。カーソル方式なので、読み込み中に投稿が増えても重複・欠落しない。
      operationId: post_timeline
      parameters:
      - description: '`following`(自分+フォロー中)または `all`(全体)。省略時は `all`'
        in: query
        name: scope
        required: false
        schema:
          type: string
          default: all
          enum:
          - following
          - all
      - description: 前回の応答の `nextCursor`。省略すると先頭から(中身は不透明な文字列で、解釈しない)
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: 1ページの件数。1〜50、省略時は 20
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 50
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 入力内容の誤り
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 未ログイン、またはトークンが無効・期限切れ
      summary: タイムラインを取得
      tags:
      - 投稿・タイムライン
  /api/uploads/presign:
    post:
      description: 画像を S3 へ直接 PUT するための URL を発行する。`requiredHeaders` を付けて `uploadUrl`
        へ PUT し、返った `objectKey` を投稿・プロフィール更新で渡す。キーはサーバーが決める。形式は JPEG・PNG・GIF・WebP、サイズは投稿画像
        5MB・アイコン 2MB 以下。有効期限は 5 分。
      operationId: upload_presign
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 入力内容の誤り
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 未ログイン、またはトークンが無効・期限切れ
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 発行が多すぎる(1 ユーザーあたり 1 分に 30 回まで)。`Retry-After` 秒後にやり直せる
      summary: 署名付き URL を発行
      tags:
      - 画像アップロード
  /api/users:
    get:
      description: ユーザーID・表示名の部分一致(大文字小文字を区別しない)。自分は除く。並びはユーザーID(小文字)の昇順。`q` の先頭の
        `@` と前後の空白は無視する。`%` `_` は文字として扱う。
      operationId: userSearch_search
      parameters:
      - description: 検索語。前後の空白と先頭の `@` は無視し、1〜50文字(空は 400)
        in: query
        name: q
        required: true
        schema:
          type: string
      - description: 前回の応答の `nextCursor`。省略すると先頭から(中身は不透明な文字列で、解釈しない)
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: 1ページの件数。1〜50、省略時は 20
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 50
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUserListResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 入力内容の誤り
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 未ログイン、またはトークンが無効・期限切れ
      summary: ユーザーを検索
      tags:
      - ユーザー検索
  /api/users/me:
    get:
      description: "`GET /api/users/{id}` と同じ形式。`isMe` は true。"
      operationId: profile_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 未ログイン、またはトークンが無効・期限切れ
      summary: 自分のプロフィールを取得
      tags:
      - プロフィール(自分)
    put:
      description: 表示名(1〜30文字)・自己紹介(0〜160文字)を置き換える。ユーザーIDは変更できない。アイコンは `avatarKey`
        で変更する(省略=変更なし / `null`=削除 / 文字列=アップロード済みの新しい画像)。
      operationId: profile_update
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 入力内容の誤り
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: 未ログイン、またはトークンが無効・期限切れ
      summary: 自分のプロフィールを更新
      tags:
      - プロフィール(自分)
  /api/users/{id}:
    get:
      description: 投稿数(削除済みを除く)・フォロー数・フォロワー数・自分がフォロー済みか・自分自身かを含む。`me` は使えない(自分は `GET
        /api/users/me`)。
      operationId: user_profile
      parameters:
      - description: 対象の ID(内部ID・数値)
        in: path
        name: id
        required: true
        schema:
