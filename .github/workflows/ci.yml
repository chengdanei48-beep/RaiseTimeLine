name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しい push があったら、古い実行を止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (mvnw verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # テスト + Spotless + Checkstyle + SpotBugs。
      # DB は Testcontainers が起動する(ubuntu-latest には Docker が入っている)。
      - run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: frontend (lint / typecheck / build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: e2e (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 性能計測(@perf)は実時間に依存するため手動専用。CI では既定で除外される(playwright.config.ts)。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: raisetimeline_e2e
          POSTGRES_USER: raisetimeline
          POSTGRES_PASSWORD: e2e-ci-password
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U raisetimeline -d raisetimeline_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_NAME: raisetimeline_e2e
      DB_USER: raisetimeline
      DB_PASSWORD: e2e-ci-password
      JWT_SECRET: e2e-ci-jwt-secret-at-least-32-bytes-long
      S3_PORT: "9000"
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: raisetimeline-e2e
      # S3Mock は値を検証しないが、未設定だと AWS SDK が実際の認証チェーン(IMDS 等)を
      # 探しに行って失敗する(presign が 500 になる)。.env.example と同じダミー値を設定する
      S3_ACCESS_KEY: dev-access-key
      S3_SECRET_KEY: dev-secret-key
      REFRESH_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: S3Mock を起動する
        run: |
          docker run -d --name raisetimeline-s3 \
            -p 9000:9090 \
            -e COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=raisetimeline-e2e \
            adobe/s3mock:latest
          for i in $(seq 1 20); do curl -sf http://localhost:9000/ > /dev/null && exit 0; sleep 1; done
          echo "S3Mock が起動しませんでした"; exit 1

      - name: バックエンドを build して起動する(e2e プロファイル)
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: バックエンドを起動する
        working-directory: backend
        run: |
          nohup java -jar target/raisetimeline-*.jar --spring.profiles.active=e2e > backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/health > /dev/null && exit 0; sleep 2; done
          echo "バックエンドが起動しませんでした"; cat backend.log; exit 1

      - name: フロントエンドを build して preview を起動する
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm run preview > preview.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:5173/ > /dev/null && exit 0; sleep 1; done
          echo "フロントエンドが起動しませんでした"; cat preview.log; exit 1

      - name: E2E パッケージの依存を入れ、型検査する
        working-directory: e2e
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium

      - name: Playwright を実行する
        working-directory: e2e
        run: npm test

      - name: バックエンドのログ(失敗時)
        if: failure()
        run: cat backend/backend.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
